# This rule is not used by the project kubeagent itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the kubeagent.kubeagent.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubeagent
    app.kubernetes.io/managed-by: kustomize
  name: kubetask-editor-role
rules:
- apiGroups:
  - kubeagent.kubeagent.dev
  resources:
  - kubetasks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubeagent.kubeagent.dev
  resources:
  - kubetasks/status
  verbs:
  - get
