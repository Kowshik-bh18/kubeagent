---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - kubeagent.kubeagent.dev
  resources:
  - kubetasks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubeagent.kubeagent.dev
  resources:
  - kubetasks/finalizers
  verbs:
  - update
- apiGroups:
  - kubeagent.kubeagent.dev
  resources:
  - kubetasks/status
  verbs:
  - get
  - patch
  - update
